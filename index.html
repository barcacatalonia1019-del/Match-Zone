<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Match Zone</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:#fff;font-family:Arial,sans-serif}
header{padding:22px;background:#191919;border-bottom:2px solid #d6ad45}
h1{margin:0;color:#e4bd58}
header p{color:#bbb}
nav{display:flex;gap:8px;padding:12px;overflow:auto}
button{background:#262626;color:#e4bd58;border:1px solid #66552b;border-radius:9px;padding:12px;cursor:pointer}
main{padding:14px;max-width:700px;margin:auto}
.card{background:#1c1c1c;border:1px solid #393126;border-radius:14px;padding:16px;margin:12px 0}
label{display:block;margin:10px 0;color:#ddd}
input{background:#101010;color:white;border:1px solid #555;border-radius:7px;padding:10px;width:75px}
input[type=text]{width:100%}
.gold{color:#e4bd58}
.small{color:#aaa;font-size:13px}
</style>
</head>
<body>
<header>
<h1>⚽ MATCH ZONE</h1>
<p>توقع النتيجة.. واجمع النقاط!</p>
</header>
<nav>
<button onclick="show('matches')">المباريات</button>
<button onclick="show('ranking')">الترتيب</button>
<button onclick="show('rules')">القواعد</button>
</nav>
<main id="app"></main>
<script>
const matches=[
{id:1,league:"الدوري الإنجليزي",home:"أرسنال",away:"تشيلسي",date:"أضف موعد المباراة"},
{id:2,league:"دوري أبطال أوروبا",home:"ريال مدريد",away:"يوفنتوس",date:"أضف موعد المباراة"}
];
let picks=JSON.parse(localStorage.getItem("mz_picks")||"{}");
let name=localStorage.getItem("mz_name")||"";
function save(){localStorage.setItem("mz_picks",JSON.stringify(picks))}
function show(page){
let app=document.getElementById("app");
if(page==="matches"){
app.innerHTML=<div class="card"><h3>اسمك في اللعبة</h3><input type="text" id="player" placeholder="اكتب اسمك" value="${name}" style="width:100%"><button onclick="setName()">حفظ الاسم</button><p class="small">نسخة تجريبية: المباريات هنا أمثلة وليست جدولًا مباشرًا.</p></div>+
matches.map(m=><div class="card"><span class="gold">${m.league}</span><h3>${m.home} × ${m.away}</h3><p class="small">${m.date}</p><label>${m.home}: <input type="number" min="0" id="h${m.id}" value="${picks[m.id]?.h??''}"></label><label>${m.away}: <input type="number" min="0" id="a${m.id}" value="${picks[m.id]?.a??''}"></label><button onclick="savePick(${m.id})">حفظ التوقع</button></div>).join("");
}else if(page==="ranking"){
app.innerHTML=<div class="card"><h2 class="gold">ترتيب اللاعبين</h2><p>التوقعات محفوظة على هذا الجهاز فقط في النسخة التجريبية.</p><p>لا يوجد ترتيب مشترك بين الأصدقاء بعد.</p></div>;
}else{
app.innerHTML=<div class="card"><h2 class="gold">نظام النقاط</h2><p>النتيجة الصحيحة بالضبط: 15 نقطة</p><p>توقع الفائز أو التعادل فقط: 5 نقاط</p><p>النتيجة الخاطئة: 0 نقطة</p></div>;
}}
function setName(){name=document.getElementById("player").value.trim();localStorage.setItem("mz_name",name);alert("تم حفظ الاسم على هذا الجهاز");}
function savePick(id){
if(!name){alert("اكتب اسمك واحفظه أولًا");return}
let h=document.getElementById("h"+id).value,a=document.getElementById("a"+id).value;
if(h===""a===""+h<0||+a<0){alert("اكتب توقع النتيجة للفريقين");return}
picks[id]={h:+h,a:+a};save();alert("تم حفظ توقعك على هذا الجهاز");
}
show("matches");
</script>
</body>
</html>
